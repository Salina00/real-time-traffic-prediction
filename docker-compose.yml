version: '3.8'

services:
  # ============================================================================
  # Apache Kafka (KRaft mode - Single Broker, No Zookeeper)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: pune-traffic-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # Topic Initialization Service (Auto-creates 'pune-traffic-raw' idempotently)
  # ============================================================================
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: pune-traffic-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /bin/sh -c "
        echo 'Checking and creating topic pune-traffic-raw...'
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic pune-traffic-raw
        echo 'Listing existing topics:'
        /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:29092
        echo 'Kafka initialization complete!'
      "

  # ============================================================================
  # Spark Structured Streaming Container Service (Optional Dockerized Execution)
  # Run via: docker compose run --rm spark-streaming
  # ============================================================================
  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: pune-traffic-spark
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=pune-traffic-raw
      - PROCESSED_DATA_DIR=/app/data/processed
      - SPARK_CHECKPOINT_DIR=/app/data/processed/checkpoints
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    profiles:
      - spark
